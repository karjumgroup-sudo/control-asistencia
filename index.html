<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control de Asistencia - Karjim</title>

  <!-- Ícono para pestaña del navegador -->
  <link rel="icon" type="image/jpeg" href="Icono Karjim CR.jpeg">

  <!-- Ícono al agregar a pantalla de inicio en iPhone/iPad -->
  <link rel="apple-touch-icon" href="Icono Karjim CR.jpeg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Asistencia Karjim">

  <!-- Ícono y comportamiento al agregar a pantalla de inicio en Android -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#D2B47C">

  <style>
    :root {
      --primary-color: #D2B47C;      
      --primary-hover: #C2A36B;      
      --bg-gradient-start: #F5F6F8;   
      --bg-gradient-end: #E2E4E9;     
      --text-dark: #2C3E50;
      --text-muted: #6C7A89;
      --white: #FFFFFF;
      --danger: #E74C3C;
      --success: #2ECC71;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    
    body { 
      background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%); 
      margin: 0; 
      padding: 15px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
    }
    
    .container { 
      background: var(--white); 
      padding: 30px 25px; 
      border-radius: 24px; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.08); 
      width: 100%; 
      max-width: 440px; 
      text-align: center; 
    }

  
    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    .brand-logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 6px 15px rgba(210, 180, 124, 0.4);
      margin-bottom: 12px;
    }

    .brand-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-dark);
      margin: 0;
      letter-spacing: 0.5px;
    }

    .badge-location { 
      display: inline-flex; 
      align-items: center; 
      gap: 8px; 
      padding: 8px 16px; 
      border-radius: 50px; 
      font-size: 0.85rem; 
      font-weight: 600; 
      margin-bottom: 12px; 
      background: #FFF8E7; 
      color: #B8860B; 
      border: 1px solid #F3E5AB;
    }
    .badge-location.ok { background: #E8F8F5; color: #117A65; border-color: #A3E4D7; }
    .badge-location.error { background: #FDEDEC; color: #922B21; border-color: #FADBD8; }

    .device-info { 
      font-size: 0.8rem; 
      color: var(--text-muted); 
      margin-bottom: 18px; 
      font-weight: 500;
    }

    .display-cedula { 
      width: 100%; 
      height: 55px; 
      font-size: 1.8rem; 
      font-weight: 700; 
      text-align: center; 
      border: 2px solid #E2E8F0; 
      border-radius: 12px; 
      margin-bottom: 18px; 
      background: #FAFAFA; 
      color: var(--text-dark);
      letter-spacing: 2px; 
      outline: none;
    }

    .keypad { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      gap: 10px; 
      margin-bottom: 20px; 
    }

    .btn-key { 
      background: #F8F9FA; 
      border: 1px solid #E9ECEF; 
      padding: 16px; 
      font-size: 1.5rem; 
      font-weight: 600; 
      border-radius: 12px; 
      cursor: pointer; 
      color: var(--text-dark);
      transition: all 0.15s ease;
    }
    .btn-key:active { 
      background: #E2E8F0; 
      transform: scale(0.98);
    }
    .btn-clear { background: #FADBD8; color: #922B21; border: none; }
    .btn-delete { background: #FCF3CF; color: #B7950B; border: none; }

    .btn-submit { 
      width: 100%; 
      background: var(--primary-color); 
      color: var(--white); 
      border: none; 
      padding: 18px; 
      font-size: 1.2rem; 
      font-weight: 700; 
      border-radius: 12px; 
      cursor: pointer; 
      box-shadow: 0 6px 18px rgba(210, 180, 124, 0.4);
      transition: all 0.2s ease; 
      letter-spacing: 0.5px;
    }
    .btn-submit:hover:not(:disabled) {
      background: var(--primary-hover);
    }
    .btn-submit:disabled { 
      background: #BDC3C7; 
      box-shadow: none;
      cursor: not-allowed; 
    }

    .btn-reset {
      background: transparent; 
      border: none; 
      color: var(--text-muted); 
      text-decoration: underline; 
      margin-top: 15px; 
      cursor: pointer; 
      font-size: 0.8rem;
    }


    .overlay { 
      position: fixed; 
      top:0; left:0; width:100%; height:100%; 
      background: rgba(0,0,0,0.6); 
      backdrop-filter: blur(4px);
      display: none; 
      justify-content: center; 
      align-items: center; 
      padding: 20px; 
      z-index: 99; 
    }
    .card-result { 
      background: var(--white); 
      padding: 30px; 
      border-radius: 20px; 
      text-align: center; 
      width: 100%; 
      max-width: 380px; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .card-result.success { border-top: 8px solid var(--primary-color); }
    .card-result.error { border-top: 8px solid var(--danger); }
    .card-result h2 { margin: 10px 0; font-size: 1.6rem; color: var(--text-dark); }
    .card-result p { font-size: 1rem; color: var(--text-muted); margin: 8px 0; }
  </style>
</head>
<body>

  <div class="container">

    <div class="brand-header">
      
      <img src="Icono Karjim CR.jpeg" alt="Karjim Logo" class="brand-logo">
      <h1 class="brand-title">Control de Asistencia</h1>
    </div>

    <div id="badge-gps" class="badge-location">📍 Obteniendo ubicación...</div>
    <div id="device-info" class="device-info">Cargando verificación de dispositivo...</div>

    <input type="text" id="cedula-input" class="display-cedula" readonly placeholder="Cédula">

    <div id="keypad" class="keypad">
      <button class="btn-key" onclick="pressNum('1')">1</button>
      <button class="btn-key" onclick="pressNum('2')">2</button>
      <button class="btn-key" onclick="pressNum('3')">3</button>
      <button class="btn-key" onclick="pressNum('4')">4</button>
      <button class="btn-key" onclick="pressNum('5')">5</button>
      <button class="btn-key" onclick="pressNum('6')">6</button>
      <button class="btn-key" onclick="pressNum('7')">7</button>
      <button class="btn-key" onclick="pressNum('8')">8</button>
      <button class="btn-key" onclick="pressNum('9')">9</button>
      <button class="btn-key btn-clear" onclick="clearAll()">C</button>
      <button class="btn-key" onclick="pressNum('0')">0</button>
      <button class="btn-key btn-delete" onclick="deleteLast()">⌫</button>
    </div>

    <button id="btn-marcar" class="btn-submit" onclick="enviarMarca()" disabled>MARCAR ASISTENCIA</button>

   
  </div>

  <!-- Modal -->
  <div id="overlay" class="overlay">
    <div id="card-result" class="card-result">
      <h2 id="res-title"></h2>
      <p id="res-name" style="font-weight: bold; color: var(--text-dark);"></p>
      <p id="res-msg"></p>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzRvtKwPBUowWtr1OpPosuc-Jh5FoNxd2SiqKMixXkQKuXNEqvgXEBXeISGnvbfhoOe/exec";

    // ⚠️ Debe coincidir EXACTAMENTE con SHARED_TOKEN en Config.gs
    const APP_TOKEN = "CAMBIA-ESTE-TOKEN-2026";

    // Esta lista solo se usa para mostrar un mensaje rápido en pantalla (UX).
    // La validación real y definitiva ocurre en el servidor (Ubicacion.gs),
    // que recalcula todo a partir de las coordenadas crudas.
    const PLAZAS = [
      { nombre: "Multiplaza Escazú", lat: 9.94506212827314, lng: -84.15205751759024 },
      { nombre: "Multiplaza Curridabat", lat: 9.917243975407315, lng: -84.04671783293279 },
      { nombre: "Paseo las Flores", lat: 9.985381654337761, lng: -84.11120067526092 },
      { nombre: "Plaza Lincoln", lat: 9.96283796993263, lng: -84.05592175012283 },
      { nombre: "Paseo Metrópoli", lat: 9.86722326167942, lng: -83.94264286176883 },
      { nombre: "Parque de Diversiones", lat: 9.96110933882435, lng: -84.12798125520388 },
      { nombre: "Paseo Colón", lat: 9.934178813755564, lng: -84.09087057561013 },
      { nombre: "Vistas de la Cruz", lat: 9.903030669839145, lng: -84.0869393501236 }
    ];

    let latDetectada = null;
    let lngDetectada = null;
    let deviceId = "";

    function inicializarDeviceId() {
      deviceId = localStorage.getItem("app_device_id");
      if (!deviceId) {
        deviceId = crypto.randomUUID();
        localStorage.setItem("app_device_id", deviceId);
      }

      const cedulaGuardada = localStorage.getItem("app_user_cedula");
      if (cedulaGuardada) {
        document.getElementById("cedula-input").value = cedulaGuardada;
        document.getElementById("keypad").style.display = "none";
        document.getElementById("device-info").innerText = "🔒 Dispositivo vinculado a: " + cedulaGuardada;
      } else {
        document.getElementById("device-info").innerText = "📱 Dispositivo listo para vinculación";
      }
    }

    function obtenerUbicacion() {
      const badge = document.getElementById("badge-gps");
      
      if (!navigator.geolocation) {
        badge.className = "badge-location error";
        badge.innerHTML = "❌ GPS no soportado";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          latDetectada = pos.coords.latitude;
          lngDetectada = pos.coords.longitude;

          let plazaEncontrada = null;

          for (let p of PLAZAS) {
            const dist = calcularDistanciaKM(latDetectada, lngDetectada, p.lat, p.lng);
            if (dist <= 0.5) {
              plazaEncontrada = p.nombre;
              break;
            }
          }

          if (plazaEncontrada) {
            badge.className = "badge-location ok";
            badge.innerHTML = `📍 ${plazaEncontrada}`;
            document.getElementById("btn-marcar").disabled = false;
          } else {
            badge.className = "badge-location error";
            badge.innerHTML = "⚠️ Fuera de rango de ubicación";
            document.getElementById("btn-marcar").disabled = true;
          }
        },
        (err) => {
          badge.className = "badge-location error";
          badge.innerHTML = "⚠️ Debe activar el GPS";
          document.getElementById("btn-marcar").disabled = true;
        },
        { enableHighAccuracy: true }
      );
    }

    function calcularDistanciaKM(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function pressNum(num) {
      const input = document.getElementById("cedula-input");
      if (input.value.length < 15) input.value += num;
    }
    function deleteLast() {
      const input = document.getElementById("cedula-input");
      input.value = input.value.slice(0, -1);
    }
    function clearAll() {
      document.getElementById("cedula-input").value = "";
    }

    async function enviarMarca() {
      const cedula = document.getElementById("cedula-input").value.trim();
      if (!cedula) return alert("Por favor digite su cédula.");

      if (latDetectada === null || lngDetectada === null) {
        return alert("Aún no se ha detectado su ubicación. Active el GPS e intente de nuevo.");
      }

      const btn = document.getElementById("btn-marcar");
      btn.disabled = true;
      btn.innerText = "Procesando...";

      try {
        const response = await fetch(WEB_APP_URL, {
          method: "POST",
          mode: "cors",
          redirect: "follow",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            token: APP_TOKEN,
            cedula: cedula,
            deviceId: deviceId,
            lat: latDetectada,
            lng: lngDetectada
          })
        });

        const res = await response.json();
        
        if (res.status === "SUCCESS") {
          localStorage.setItem("app_user_cedula", cedula);
          document.getElementById("keypad").style.display = "none";
          document.getElementById("device-info").innerText = "🔒 Dispositivo vinculado a: " + cedula;
        }

        mostrarResultado(res);

      } catch (err) {
        mostrarResultado({ status: "ERROR", message: "Error de conexión o permisos." });
      } finally {
        btn.disabled = false;
        btn.innerText = "MARCAR ASISTENCIA";
      }
    }

    function mostrarResultado(res) {
      const overlay = document.getElementById("overlay");
      const card = document.getElementById("card-result");
      const title = document.getElementById("res-title");
      const name = document.getElementById("res-name");
      const msg = document.getElementById("res-msg");

      if (res.status === "SUCCESS") {
        card.className = "card-result success";
        title.innerText = `✅ ${res.tipo}`;
        name.innerText = res.nombre;
        msg.innerText = `Registrado en ${res.ubicacion} a las ${res.hora}`;
      } else if (res.status === "OUT_OF_RANGE") {
        card.className = "card-result error";
        title.innerText = "⚠️ FUERA DE RANGO";
        name.innerText = "";
        msg.innerText = res.message || "Su ubicación no coincide con ninguna plaza.";
      } else {
        card.className = "card-result error";
        title.innerText = "❌ ERROR";
        name.innerText = "";
        msg.innerText = res.message || "No se pudo registrar la marca.";
      }

      overlay.style.display = "flex";
      setTimeout(() => { overlay.style.display = "none"; }, 3500);
    }

    window.onload = () => {
      inicializarDeviceId();
      obtenerUbicacion();
    };
  </script>
</body>
</html>
